name: Змейка

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Нарисовать змейку из сетки контрибуций
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=%237B2CBF&color_dots=%23ebedf0,%23e0c3fc,%23c77dff,%239d4edd,%235a189a
            dist/snake-dark.svg?color_snake=%23C77DFF&color_dots=%2313111C,%235a189a,%237b2cbf,%239d4edd,%23c77dff

      - name: Положить результат в ветку output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
